{% extends "clues-wrapper.html" %}

{% block title %}
    Police Station
{% endblock %}

{% block stylesheet %}
    <link rel="stylesheet" href="{{ url_for('static',filename='style/police-station.css') }}">
{% endblock %}

{% block content %}
    <h1>Police Station</h1>
    <div class="page-container">
        <div>
            <h2>Search reports:</h2>
            <form action="" method="POST">
                <input name="id" type="hidden" value="reports" >
                <input name="day" type="number" placeholder="Day" max="31" min="1">
                <input name="month" type="number" placeholder="Month" max="12" min="1">
                <input name="year" type="number" placeholder="Year" max="2025" min="2000">
                <input name="street" type="text" placeholder="Street">
                <button type="submit">search</button>
            </form>
        </div>
        <div>
            <h3>Search interviews:</h3>
        </div>
    </div>
{% endblock %}
